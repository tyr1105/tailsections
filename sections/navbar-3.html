  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <a href="#" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center border border-white/30">
          <span class="text-white font-bold text-sm">T</span>
        </div>
        <span class="text-xl font-bold text-white">TailSections</span>
      </a>
      <div class="hidden md:flex items-center gap-8">
        <a href="#" class="text-sm font-medium text-white/80 hover:text-white transition-colors">Features</a>
        <a href="#" class="text-sm font-medium text-white/80 hover:text-white transition-colors">Pricing</a>

      </div>
    </div>
  </div>
</nav>
<script>
  // Add this script to make the navbar solid on scroll
  window.addEventListener('scroll', function() {
    const nav = document.getElementById('navbar-transparent');
    if (window.scrollY > 50) {
      nav.classList.add('bg-gray-900/95', 'backdrop-blur-lg', 'shadow-lg');
      nav.classList.remove('bg-transparent');
    } else {
      nav.classList.remove('bg-gray-900/95', 'backdrop-blur-lg', 'shadow-lg');
      nav.classList.add('bg-transparent');
    }
  });
</script>
