<!-- Contact #1 - Form with Map -->
<section class="py-20 bg-white dark:bg-gray-950">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <span class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 tracking-wide uppercase">Contact</span>
      <h2 class="mt-3 text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white">Get in Touch</h2>
      <p class="mt-4 max-w-2xl mx-auto text-lg text-gray-500 dark:text-gray-400">Have a question or need help? We'd love to hear from you.</p>
    </div>
    <div class="grid lg:grid-cols-2 gap-12">
      <!-- Form -->
      <div>
        <form class="space-y-6">
          <div class="grid sm:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
              <input type="text" placeholder="John" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
              <input type="text" placeholder="Doe" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
            <input type="email" placeholder="john@example.com" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subject</label>
            <select class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
              <option>General Inquiry</option>
              <option>Technical Support</option>
              <option>License Question</option>
              <option>Partnership</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Message</label>
            <textarea rows="5" placeholder="How can we help?" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"></textarea>
          </div>
          <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-500/25">Send Message</button>
        </form>
      </div>
      <!-- Map / Info -->
      <div class="space-y-6">
        <div class="w-full h-64 bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-900 rounded-2xl flex items-center justify-center border border-gray-200 dark:border-gray-700">
          <div class="text-center">
            <span class="text-4xl">🗺️</span>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-2">Map Placeholder</p>
          </div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div class="p-6 bg-gray-50 dark:bg-gray-900 rounded-xl">
            <span class="text-2xl block mb-2">📧</span>
            <p class="font-semibold text-gray-900 dark:text-white text-sm">Email</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">hello@tailsections.com</p>
          </div>
          <div class="p-6 bg-gray-50 dark:bg-gray-900 rounded-xl">
            <span class="text-2xl block mb-2">💬</span>
            <p class="font-semibold text-gray-900 dark:text-white text-sm">Discord</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">Join our community</p>
          </div>
          <div class="p-6 bg-gray-50 dark:bg-gray-900 rounded-xl">
            <span class="text-2xl block mb-2">📍</span>
            <p class="font-semibold text-gray-900 dark:text-white text-sm">Location</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">San Francisco, CA</p>
          </div>
          <div class="p-6 bg-gray-50 dark:bg-gray-900 rounded-xl">
            <span class="text-2xl block mb-2">⏰</span>
            <p class="font-semibold text-gray-900 dark:text-white text-sm">Response Time</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">Within 24 hours</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
